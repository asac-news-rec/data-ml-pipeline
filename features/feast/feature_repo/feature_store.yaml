# 로컬 실습용: 오프라인 = parquet 파일, 온라인 = SQLite 파일
# 실서비스로 옮길 때는 feature_store.gcp.yaml.example 처럼 bigquery / redis(Valkey)로 바꾼다.
project: news_rec
provider: local
registry: ../data/registry.db
offline_store:
  type: file
online_store:
  type: sqlite
  path: ../data/online_store.db
entity_key_serialization_version: 3
