name: Feast apply

# definitions.py가 바뀌면
#   - PR: plan job이 feast plan으로 무엇이 바뀌는지 보여 준다 (registry는 그대로, 읽기 전용 계정).
#   - main 머지·수동 실행: apply job이 feast apply로 GCS registry에 정의를 적는다 (쓰기 계정, production 환경).
on:
  pull_request:
    paths:
      - "features/feast/feature_repo/**"
      - "features/feast/requirements.txt"
      - ".github/workflows/feast-apply.yml"
  push:
    branches: [main]
    paths:
      - "features/feast/feature_repo/**"
      - "features/feast/requirements.txt"
      - ".github/workflows/feast-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GCP Workload Identity Federation 인증에 필요

# 값은 저장소 Settings > Secrets and variables > Actions > Variables(저장소 수준)에 둔다. 비밀값이 아니다.
# job의 if:는 Environment 변수를 읽지 못하므로 Environment가 아니라 저장소 수준에 넣는다.
env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  FEAST_REGISTRY_PATH: ${{ vars.FEAST_REGISTRY_PATH }}       # 예: gs://<model-artifacts 버킷>/feast/registry.pb
  FEAST_BQ_TEMP_DATASET: ${{ vars.FEAST_BQ_TEMP_DATASET }}   # 예: feat
  FEAST_SOURCE: bigquery
  FEAST_BQ_DATASET: ${{ vars.GCP_PROJECT_ID }}.${{ vars.FEAST_BQ_DATASET }}  # source table이 있는 데이터셋

jobs:
  plan:
    # PR에서만 돈다. 변수가 다 들어가기 전에는 건너뛴다 (없으면 Feast가 빈 경로로 실패한다)
    if: >-
      github.event_name == 'pull_request' &&
      vars.GCP_PROJECT_ID != '' && vars.FEAST_REGISTRY_PATH != '' &&
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_FEAST_PLAN_SA != '' &&
      vars.FEAST_BQ_TEMP_DATASET != '' && vars.FEAST_BQ_DATASET != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: features/feast/feature_repo
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (읽기 전용 계정)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FEAST_PLAN_SA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: features/feast/requirements.txt

      - name: Install Feast
        run: pip install -r ../requirements.txt

      - name: feast plan
        run: feast -f feature_store.ci.yaml plan

  apply:
    # main push와 수동 실행에서 돈다. production 환경 규칙(main 브랜치만)을 통과해야 쓰기 계정을 쓴다.
    if: >-
      github.event_name != 'pull_request' &&
      vars.GCP_PROJECT_ID != '' && vars.FEAST_REGISTRY_PATH != '' &&
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_FEAST_APPLY_SA != '' &&
      vars.FEAST_BQ_TEMP_DATASET != '' && vars.FEAST_BQ_DATASET != ''
    runs-on: ubuntu-latest
    environment: production
    # apply 두 개가 동시에 registry를 쓰지 않게 한다 (plan은 쓰지 않으므로 기다리지 않는다)
    concurrency:
      group: feast-registry
      cancel-in-progress: false
    defaults:
      run:
        working-directory: features/feast/feature_repo
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP (쓰기 계정)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FEAST_APPLY_SA }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: features/feast/requirements.txt

      - name: Install Feast
        run: pip install -r ../requirements.txt

      - name: feast apply
        run: feast -f feature_store.ci.yaml apply
