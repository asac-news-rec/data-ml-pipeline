name: Feast apply

# definitions.py가 바뀌면
#   - PR: feast plan으로 무엇이 바뀌는지 보여 준다 (registry는 그대로).
#   - main 머지: feast apply로 GCS registry에 정의를 적는다.
#
# GCS file registry는 통째로 덮어쓴다. 그래서 materialize DAG(매시)가 같은 파일에 적재 구간을
# 쓰는 중이면 나중에 쓴 쪽이 이긴다. 정의를 배포할 때는 DAG를 멈추고, 실행 중이던 materialize
# task와 Pod가 모두 끝난 뒤 apply하고 다시 켠다
# (features/feast/README.md '정의 변경 배포 순서').
on:
  pull_request:
    paths:
      - "features/feast/feature_repo/**"
      - "features/feast/requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/feast-apply.yml"
  push:
    branches: [main]
    paths:
      - "features/feast/feature_repo/**"
      - "features/feast/requirements.txt"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/feast-apply.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # GCP Workload Identity Federation 인증에 필요

# apply 두 개가 동시에 registry를 쓰지 않게 한다
concurrency:
  group: feast-registry
  cancel-in-progress: false

jobs:
  feast:
    # Settings > Variables에 값이 다 들어가기 전에는 건너뛴다 (없으면 Feast가 빈 경로로 실패한다)
    if: >-
      vars.GCP_PROJECT_ID != '' && vars.FEAST_REGISTRY_PATH != '' &&
      vars.GCP_WIF_PROVIDER != '' && vars.GCP_FEAST_SA != '' &&
      vars.FEAST_BQ_TEMP_DATASET != '' && vars.FEAST_BQ_DATASET != ''
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: features/feast/feature_repo
    env:
      # 값은 저장소 Settings > Variables에 둔다 (비밀값 아님)
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      FEAST_REGISTRY_PATH: ${{ vars.FEAST_REGISTRY_PATH }}       # 예: gs://<model-artifacts 버킷>/feast/registry.pb
      FEAST_BQ_TEMP_DATASET: ${{ vars.FEAST_BQ_TEMP_DATASET }}   # 예: feat
      FEAST_SOURCE: bigquery
      FEAST_BQ_DATASET: ${{ vars.GCP_PROJECT_ID }}.${{ vars.FEAST_BQ_DATASET }}  # source table이 있는 데이터셋
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_FEAST_SA }}

      # 작업 이미지와 같은 의존성을 쓴다 (저장소 루트 pyproject.toml + uv.lock)
      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "0.13.7"   # uv.lock을 만든 버전

      - name: Sync dependencies
        run: uv sync --frozen --extra airflow-dag --project ../../..

      - name: feast plan (PR)
        if: github.event_name == 'pull_request'
        run: uv run --frozen --extra airflow-dag --project ../../.. feast -f feature_store.ci.yaml plan

      - name: feast apply (main)
        if: github.event_name != 'pull_request'
        run: uv run --frozen --extra airflow-dag --project ../../.. feast -f feature_store.ci.yaml apply
