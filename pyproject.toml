[project]
name = "data-ml-pipeline"
version = "0.1.0"
description = "ASAC news recommendation data/ML pipeline"
requires-python = ">=3.12,<3.13"
dependencies = []

# 버전은 uv.lock으로 고정한다. 작업 이미지와 CI는 `uv sync --frozen --extra <묶음>`으로 설치한다.
# 묶음 안의 패키지에 버전을 적지 않는 이유: Feast가 요구하는 범위를 lock이 맞춰 주고,
# lock만 갱신하면 이미지와 CI가 같은 버전을 쓴다.

[project.optional-dependencies]
# Airflow가 띄우는 Python 3.12 작업 이미지 (Feast materialize)
airflow-dag = [
  "feast[gcp,redis]==0.68.0",
  "google-cloud-bigquery",
  "db-dtypes",
  "pandas",
  "pyarrow",
  "numpy",
]
# 기사 임베딩 작업 이미지 (embed_articles). torch는 CPU 빌드만 받는다(아래 tool.uv.sources).
embed = [
  "sentence-transformers",
  "torch",
  "psycopg[binary]",
  "google-cloud-bigquery",
  "google-cloud-secret-manager",
]
# 학습 Job 이미지 (LightGBM, MLflow)
train = [
  "feast[gcp,redis]==0.68.0",
  "lightgbm",
  "scikit-learn",
  "mlflow",
  "pandas",
  "pyarrow",
  "numpy",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
