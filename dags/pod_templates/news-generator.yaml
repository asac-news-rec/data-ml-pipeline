# Secret·PVC·Cloud SQL 값은 인프라에서 준비한 실제 이름으로 교체합니다.
apiVersion: v1
kind: Pod
metadata:
  name: news-generator
  namespace: airflow
spec:
  restartPolicy: Never
  serviceAccountName: airflow-task
  containers:
    - name: base
      # 실제 이미지와 실행 명령은 generate_news.py의 설정으로 덮어씁니다.
      image: asia-northeast3-docker.pkg.dev/final-project-513508/news-rec/news-generator:54317e07df0dc8076c2949f8d66d0368bbdd4af6
      env:
        - name: THUMBNAIL_BUCKET
          value: final-project-513508-news-thumbnails
        # Secret 이름은 제안값이며 인프라에서 생성·권한 부여가 필요합니다.
        - name: OPENROUTER_API_KEY_SECRET
          value: projects/final-project-513508/secrets/openrouter-api-key/versions/latest
        - name: PGHOST
          value: "cloud-sql-proxy"
        - name: PGPORT
          value: "5432"
        - name: PGDATABASE
          value: newsdb
        - name: PGUSER
          value: news_app
        - name: PGPASSWORD_SECRET
          value: projects/final-project-513508/secrets/news-db-password/versions/latest
      resources:
        requests:
          cpu: "250m"
          memory: "256Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
      volumeMounts:
        - name: news-output
          mountPath: /mnt/news-output
  volumes:
    - name: news-output
      persistentVolumeClaim:
        claimName: news-output
